
name: Selenium Login Automation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Check Java, Maven, and Chrome
        run: |
          java -version
          mvn -version
          google-chrome --version || chrome --version || true

      - name: Run Selenium login tests
        run: mvn --batch-mode clean compile exec:java -Dexec.mainClass=LoginTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
